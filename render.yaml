# Render Blueprint — static test site (no database / no Node server)
# Restaurant POS by MIA Solutions Pvt. Ltd.
# Docs: https://render.com/docs/static-sites
#
# Browser localStorage only — Spice Garden demo data, not a production DB.

services:
  - type: web
    name: restaurant-pos
    runtime: static
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install --include=dev && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
